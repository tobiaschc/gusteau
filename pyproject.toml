[project]
name = "gusteau"
version = "0.1.0"
description = "Minimalist healthy recipe bank and weekly meal planner with shopping list"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
gusteau = "gusteau.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gusteau"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
