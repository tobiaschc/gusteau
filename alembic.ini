# Only for the alembic CLI while developing (`uv run alembic revision --autogenerate -m ...`).
# The app runs migrations itself on startup (gusteau.db.migrate). DB: $GUSTEAU_DATA/gusteau.db
[alembic]
script_location = gusteau/migrations

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
